name: CRISIS Intelligence news pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/index.html'
      - '.github/workflows/**'
      - 'README.md'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crisis-pilot
  cancel-in-progress: true
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline collection tests
        run: python -m unittest discover -s tests -v
      - name: Collect GDELT and RSS candidate news
        run: python scripts/collect.py
      - name: Build static browsable news archive
        run: python scripts/build_static.py
      - name: Commit updated candidate archive
        run: |
          git config user.name "crisis-intelligence-bot"
          git config user.email "crisis-intelligence-bot@users.noreply.github.com"
          git add site/data/articles.json site/data/fetch_status.json site/news.html
          if ! git diff --cached --quiet; then
            git commit -m "Update collected news candidates"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
