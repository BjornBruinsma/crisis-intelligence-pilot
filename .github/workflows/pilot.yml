name: CRISIS GDELT pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crisis-pilot
  cancel-in-progress: false
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect GDELT news candidates
        run: python scripts/collect.py
      - name: Commit updated news archive
        run: |
          git config user.name "crisis-intelligence-bot"
          git config user.email "crisis-intelligence-bot@users.noreply.github.com"
          git add site/data/articles.json site/data/fetch_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update GDELT candidate articles"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
