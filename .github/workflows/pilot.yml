name: CRISIS Intelligence news pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - 'scripts/build_static.py'
      - 'scripts/triage.py'
      - 'scripts/build_verification.py'
      - 'scripts/ai_assess.py'
      - 'scripts/primary_sources.py'
      - 'scripts/event_cluster.py'
      - 'scripts/quality_report.py'
      - 'scripts/signals.py'
      - 'tests/test_collect.py'
      - 'tests/test_ai_assess.py'
      - 'tests/test_event_research.py'
      - 'tests/test_event_audit.py'
      - 'tests/test_pairwise_cluster.py'
      - 'tests/test_quality_report.py'
      - 'tests/test_signals.py'
      - 'site/index.html'
      - '.github/workflows/pilot.yml'
      - 'README.md'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crisis-research-update
  cancel-in-progress: true
jobs:
  update-crisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline collection and research tests
        run: python -m unittest discover -s tests -v
      - name: Collect GDELT and RSS candidate news
        run: python scripts/collect.py
      - name: Build static browsable news archive
        run: python scripts/build_static.py
      - name: Build editorial review queue
        run: python scripts/triage.py
      - name: Build 25-item verification desk
        run: python scripts/build_verification.py
      - name: AI editorial assessment (usage-capped)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: gpt-4o-mini
        run: python scripts/ai_assess.py
      - name: Collect official primary-source publications
        run: python scripts/primary_sources.py
      - name: Cluster claims and compare official text (usage-capped)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_AI_MODEL: gpt-4o-mini
        run: python scripts/event_cluster.py
      - name: Publish quality metrics
        run: python scripts/quality_report.py
      - name: Publish evidence-aware signals, never probabilities
        run: python scripts/signals.py
      - name: Commit CRISIS files with bounded conflict retries
        run: |
          git config user.name "crisis-intelligence-bot"
          git config user.email "crisis-intelligence-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add site/data/articles.json site/data/fetch_status.json site/news.html site/review.html site/data/review_queue.json site/verify.html site/data/verification_candidates.json site/ai.html site/data/ai_assessments.json site/data/primary_sources.json site/data/event_candidates.json site/events.html site/quality.html site/data/quality_report.json site/signals.html site/data/signals.json site/data/signal_history.json
            if git diff --cached --quiet; then
              echo "No CRISIS data changes."
              exit 0
            fi
            git commit -m "Update CRISIS candidate news and research"
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push after three attempts."
              exit 1
            fi
            git reset --soft HEAD~1
            sleep 4
          done
  publish-pages:
    needs: update-crisis
    runs-on: ubuntu-latest
    concurrency:
      group: crisis-shared-github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deploy latest combined CRISIS and OWOP site
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
