name: CRISIS Intelligence news pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/index.html'
      - '.github/workflows/**'
      - 'README.md'
      - 'OWOP_PILOT.md'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crisis-pilot
  cancel-in-progress: true
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline collection tests
        run: python -m unittest discover -s tests -v

      - name: Collect GDELT and RSS candidate news
        run: python scripts/collect.py
      - name: Build static browsable news archive
        run: python scripts/build_static.py
      - name: Build editorial review queue (unverified headline groups)
        run: python scripts/triage.py
      - name: Build 25-item verification desk
        run: python scripts/build_verification.py
      - name: AI editorial assessment (optional, usage-capped)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: gpt-4o-mini
        run: python scripts/ai_assess.py

      - name: Collect official primary-source publications
        run: python scripts/primary_sources.py
      - name: Cluster claims and match official evidence (usage-capped)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT_AI_MODEL: gpt-4o-mini
        run: python scripts/event_cluster.py

      - name: Collect OWOP multilingual candidate news
        run: python scripts/owop_collect.py
      - name: Install OpenAI SDK for OWOP editorial board
        run: python -m pip install --quiet "openai>=2.0.0"
      - name: Run autonomous OWOP AI editorial board
        id: owop_editorial
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OWOP_MODEL: gpt-4o-mini
        run: python scripts/owop_editorial.py
      - name: Verify strongest OWOP stories with live web search
        id: owop_verify
        if: steps.owop_editorial.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OWOP_SEARCH_MODEL: gpt-5-search-api
          OWOP_RESPONSES_SEARCH_MODEL: gpt-6-luna
          OWOP_VERIFY_MODEL: gpt-4o-mini
        run: python scripts/owop_verify.py
      - name: Build OWOP pilot feed
        if: steps.owop_editorial.outcome == 'success'
        run: python scripts/owop_build.py

      - name: Commit updated candidate archive
        run: |
          git config user.name "crisis-intelligence-bot"
          git config user.email "crisis-intelligence-bot@users.noreply.github.com"
          # GitHub may receive a new commit while collection is running.
          # Keep generated working files and restage them against the latest remote HEAD,
          # instead of rebasing a data commit and risking JSON merge conflicts.
          git fetch origin main
          git reset --mixed origin/main
          git add site/data/articles.json site/data/fetch_status.json site/news.html site/review.html site/data/review_queue.json site/verify.html site/data/verification_candidates.json site/ai.html site/data/ai_assessments.json site/owop site/data/primary_sources.json site/data/event_candidates.json site/events.html
          if ! git diff --cached --quiet; then
            git commit -m "Update collected news candidates"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
